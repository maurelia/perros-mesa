<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0b0b0b">
<title>Perros RC · Mesa de Control</title>
<style>
:root{
  --bg:#0b0b0b; --panel:#161616; --panel2:#1f1f1f; --line:#2c2c2c;
  --text:#f2f2f2; --muted:#9a9a9a; --neon:#39ff14; --neon-dim:#1f8f0b;
  --warn:#ffb020; --bad:#ff4d4d; --radius:14px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(11,11,11,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
header.top img{width:38px;height:40px;object-fit:contain}
header.top h1{font-size:17px;margin:0;line-height:1.15;letter-spacing:.2px}
header.top small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:22px 0 10px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.match-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.match-meta{color:var(--muted);font-size:13.5px;margin-top:3px}
.vs{font-size:19px;font-weight:700;line-height:1.2}
.vs span{color:var(--neon)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:rgba(57,255,20,.12);color:var(--neon)}
.pill.mid{background:rgba(255,176,32,.13);color:var(--warn)}
.pill.no{background:#262626;color:var(--muted)}
.row-btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--neon);color:#061a00;border-color:var(--neon)}
.btn:disabled{opacity:.4}
select,input[type=text],input[type=search]{width:100%;min-height:42px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(17,17,17,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;padding:10px 0 12px;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--neon)}
/* player list */
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);min-height:58px}
.prow:last-child{border-bottom:0}
.prow .num{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.prow .who{flex:1;min-width:0}
.prow .nm{font-weight:600;line-height:1.25}
.prow .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.docs{display:flex;gap:5px;flex:none}
.dot{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 6px;letter-spacing:.3px}
.dot.y{background:rgba(57,255,20,.12);color:var(--neon)}
.dot.h{background:rgba(255,176,32,.13);color:var(--warn)}
.dot.n{background:rgba(255,77,77,.13);color:var(--bad)}
.dot .sm{display:none}
@media (max-width:520px){.dot .lg{display:none}.dot .sm{display:inline}.docs{flex-direction:column;gap:3px}.dot{text-align:center;min-width:26px}}
.chev{color:var(--muted);flex:none}
/* selector */
.prow.sel{background:rgba(57,255,20,.06)}
.check{width:28px;height:28px;border-radius:8px;border:2px solid #444;flex:none;display:flex;align-items:center;justify-content:center}
.prow.sel .check{background:var(--neon);border-color:var(--neon)}
.prow.sel .check::after{content:"";width:12px;height:7px;border-left:3px solid #061a00;border-bottom:3px solid #061a00;transform:rotate(-45deg) translate(1px,-2px)}
.dinput{width:52px!important;min-height:38px!important;text-align:center;padding:0 4px!important;font-weight:700}
.dinput.dup{border-color:var(--bad)!important;color:var(--bad)}
.sticky-sum{position:sticky;top:61px;z-index:4;background:var(--bg);padding:10px 0 8px}
.counter{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.counter .big{font-size:22px}
.counter .big b{color:var(--neon)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tools .btn{flex:none;min-height:38px;font-size:13.5px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.note.warn{color:var(--warn)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--neon);font-weight:600;padding:12px 0 4px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
.ov.on{display:flex}
#docs{z-index:30}
.ov-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#111;border-bottom:1px solid var(--line)}
.ov-head .t{flex:1;min-width:0}
.ov-head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-head .t small{color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.ov-body{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.doc-lbl{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}
.doc-img{display:block;width:100%;max-width:760px;margin:0 auto;border-radius:10px;background:#222}
.doc-img.zoom{width:200%;max-width:none}
.missing{border:2px dashed #3a3a3a;border-radius:12px;padding:26px 14px;text-align:center;color:var(--warn);font-weight:600}
.ov-foot{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#111;border-top:1px solid var(--line)}
/* mesa sheet (light, alto contraste para la mesa de control) */
#mesa{background:#fff;color:#111}
#mesa .ov-head{background:#fff;border-bottom:1px solid #ddd;color:#111}
#mesa .ov-head small{color:#666}
#mesa .icon-btn{background:#f0f0f0;color:#111}
#mesa .ov-body{padding:16px}
.sheet{max-width:900px;margin:0 auto;font-family:Arial,Helvetica,sans-serif}
.sheet .hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid #111;padding-bottom:10px}
.sheet .hd img{width:46px;height:48px;object-fit:contain;filter:brightness(0)}
.sheet .hd .tt{flex:1}
.sheet .hd .tt b{font-size:18px;display:block}
.sheet .hd .tt span{font-size:13px;color:#444}
.sheet .match{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;margin:12px 0 10px}
.sheet .match b{font-size:20px}
.sheet table{width:100%;border-collapse:collapse;font-size:15px}
.sheet th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:#555;border-bottom:2px solid #111;padding:6px 6px}
.sheet td{border-bottom:1px solid #ddd;padding:9px 6px;vertical-align:middle}
.sheet td.d{font-weight:800;font-size:18px;width:44px;text-align:center}
.sheet td.r{white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet td.f{white-space:nowrap;font-variant-numeric:tabular-nums;color:#333}
.sheet tr.tap{cursor:pointer}
.sheet tr.tap:active{background:#f3f3f3}
.sheet .ck{font-size:11px;font-weight:700;border-radius:5px;padding:2px 5px;background:#e7f8e2;color:#176b00;white-space:nowrap}
.sheet .ck.no{background:#ffe6e6;color:#b00000}
.sheet .ck.h{background:#fff2d6;color:#8a5a00}
.sheet .foot{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:14px}
.sheet .sign{flex:1;border-top:1px solid #111;padding-top:6px;text-align:center;margin-top:34px}
.sheet .tip{font-size:12.5px;color:#666;margin-top:10px}
#mesa .ov-foot{background:#fff;border-top:1px solid #ddd}
#mesa .btn{background:#f0f0f0;border-color:#ddd;color:#111}
#mesa .btn.primary{background:#111;border-color:#111;color:#fff}
@media (max-width:520px){.sheet td.f,.sheet th.f,.sheet .cks{display:none}.sheet table{font-size:14.5px}.sheet td.d{width:34px}}
@media print{
  body>*:not(#mesa){display:none!important}
  #mesa{position:static;display:block!important}
  #mesa .ov-head,#mesa .ov-foot,.sheet .tip,.sheet .cks{display:none!important}
  #mesa .ov-body{overflow:visible;padding:0}
  .sheet td.f,.sheet th.f{display:table-cell!important}
  @page{size:A4;margin:12mm}
}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;border:1px solid #333;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img id="logo" alt="">
  <h1>Perros RC · Mesa de Control<small>Final Master Chile +35 · Curicó · sáb 21-11</small></h1>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="wrap">
  <button id="tab-partidos" class="on" onclick="go('partidos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Partidos</button>
  <button id="tab-plantel" onclick="go('plantel')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5.4"/></svg>Plantel</button>
</div></nav>

<!-- visor de documentos -->
<div class="ov" id="docs">
  <div class="ov-head">
    <button class="icon-btn" onclick="closeDocs()" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t"><b id="d-name"></b><small id="d-sub"></small></div>
  </div>
  <div class="ov-body" id="d-body"></div>
  <div class="ov-foot">
    <button class="btn" id="d-prev" onclick="stepDoc(-1)">‹ Anterior</button>
    <button class="btn" id="d-next" onclick="stepDoc(1)">Siguiente ›</button>
  </div>
</div>

<!-- modo mesa -->
<div class="ov" id="mesa">
  <div class="ov-head">
    <button class="icon-btn" onclick="closeMesa()" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t"><b>Modo mesa</b><small>Toca un jugador para ver carnet y disclaimer</small></div>
  </div>
  <div class="ov-body"><div class="sheet" id="sheet"></div></div>
  <div class="ov-foot">
    <button class="btn" onclick="openDocsList(mesaList,0)">Ver carnets uno a uno</button>
    <button class="btn primary" onclick="window.print()">Imprimir / PDF</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="text/plain" id="appcode">
const DATA = window.__DATA;
const P = DATA.players;                       // jugadores de la Nómina Deportiva (Anexo B)
const byN = Object.fromEntries(P.map(p => [p.n, p]));
const MAX = 23;
const MATCHES = [
  {id:'p4',  fase:'Grupo D · Partido 1', opts:[{num:'4', hora:'10:10', cancha:'2', label:'Fase de grupos', rival:'Old Mineros'}]},
  {id:'p12', fase:'Grupo D · Partido 2', opts:[{num:'12', hora:'13:20', cancha:'2', label:'Fase de grupos', rival:'Titanes'}]},
  {id:'semi', fase:'Semifinal', note:'Según posición en el Grupo D', opts:[
    {num:'18', hora:'15:30', cancha:'1', label:'1° Grupo D · Semifinal Oro', rival:'1° Grupo B'},
    {num:'16', hora:'14:50', cancha:'1', label:'2° Grupo D · Semifinal Bronce', rival:'2° Grupo B'},
    {num:'14', hora:'14:10', cancha:'1', label:'3° Grupo D · Posiciones estímulo', rival:'3° Grupo B'}]},
  {id:'final', fase:'Final', note:'Si corresponde', opts:[
    {num:'22', hora:'17:30', cancha:'1', label:'Copa Oro', rival:'Ganador P.17'},
    {num:'21', hora:'16:50', cancha:'1', label:'Copa Plata', rival:'Perdedor P.17'},
    {num:'20', hora:'16:10', cancha:'1', label:'Copa Bronce', rival:'Ganador P.15'}]},
];

/* ---------- estado (se guarda en este teléfono) ---------- */
const KEY = 'perros_mesa_v1';
let S = {m:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.m) S = s; } catch (e) {}
MATCHES.forEach(m => { if (!S.m[m.id]) S.m[m.id] = {opt:0, rival:'', sel:[], dor:{}}; });
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fullName = p => `${p.nombres} ${p.pat} ${p.mat}`.trim();
const shortName = p => `${p.nombres.split(' ')[0]} ${p.pat}`;
function age(p){ const [d,m,y] = p.fnac.split('-').map(Number); const t = new Date(2026,10,21); let a = t.getFullYear()-y; if (t < new Date(2026,m-1,d)) a--; return a; }
const hasC = p => !!p.carnet[0];
const hasR = p => !!p.carnet[1];
function docDots(p){
  const t = (cls, lg, sm) => `<span class="dot ${cls}"><span class="lg">${lg}</span><span class="sm">${sm}</span></span>`;
  const c = !hasC(p) ? t('n','SIN CARNET','C ✕') : (hasR(p) ? t('y','CARNET','C ✓') : t('h','SOLO ANVERSO','C ½'));
  const d = p.disc ? t('y','DISCL.','D ✓') : t('n','SIN DISCL.','D ✕');
  return `<span class="docs">${c}${d}</span>`;
}
function opt(m){ return m.opts[S.m[m.id].opt] || m.opts[0]; }
function rival(m){ return (S.m[m.id].rival || '').trim() || opt(m).rival; }
function dorsal(mid, n){ const st = S.m[mid]; return st.dor[n] ?? ''; }
function ordered(mid){
  const st = S.m[mid];
  return st.sel.map(n => byN[n]).filter(Boolean).sort((a,b) => {
    const da = parseInt(st.dor[a.n]) || 999, db = parseInt(st.dor[b.n]) || 999;
    return da - db || st.sel.indexOf(a.n) - st.sel.indexOf(b.n);
  });
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200); }

/* ---------- navegación ---------- */
let tab = 'partidos';
function go(t, arg){
  tab = t;
  $('#tab-partidos').classList.toggle('on', t === 'partidos' || t === 'nomina');
  $('#tab-plantel').classList.toggle('on', t === 'plantel');
  ({partidos:renderPartidos, plantel:renderPlantel, nomina:renderNomina})[t](arg);
  window.scrollTo(0,0);
}

/* ---------- Partidos ---------- */
function renderPartidos(){
  const sinC = P.filter(p => !hasC(p));
  let h = '<h2>Partidos del sábado</h2>';
  MATCHES.forEach(m => {
    const st = S.m[m.id], o = opt(m), n = st.sel.length;
    const pill = n === 0 ? '<span class="pill no">Sin nómina</span>' : n === MAX ? `<span class="pill ok">${n}/${MAX} listos</span>` : `<span class="pill mid">${n}/${MAX}</span>`;
    h += `<div class="card">
      <div class="match-top"><div>
        <div class="match-meta">${esc(m.fase)} · P.${o.num}</div>
        <div class="vs"><span>Perros RC</span> vs ${esc(rival(m))}</div>
        <div class="match-meta">${o.hora} · Cancha ${o.cancha}${m.opts.length > 1 ? ' · ' + esc(o.label) : ''}</div>
      </div>${pill}</div>`;
    if (m.opts.length > 1) {
      h += `<div class="opts">
        <div><label>${esc(m.note)}</label><select onchange="setOpt('${m.id}',this.value)">${m.opts.map((x,i) => `<option value="${i}" ${i===st.opt?'selected':''}>P.${x.num} ${x.hora} · ${esc(x.label)}</option>`).join('')}</select></div>
        <div><label>Rival</label><input type="text" value="${esc(st.rival)}" placeholder="${esc(o.rival)}" onchange="setRival('${m.id}',this.value)"></div>
      </div>`;
    }
    h += `<div class="row-btns">
        <button class="btn" onclick="go('nomina','${m.id}')">Elegir nómina</button>
        <button class="btn primary" ${n ? '' : 'disabled'} onclick="openMesa('${m.id}')">Mostrar en mesa</button>
      </div></div>`;
  });
  h += `<p class="note">La nómina de juego (Anexo C) lleva hasta ${MAX} jugadores de la Nómina Deportiva y se entrega en la mesa de control a más tardar 10 minutos antes del kick-off. Cambios rotativos solo entre los ${MAX} de la nómina de ese partido.</p>`;
  if (sinC.length) h += `<p class="note warn">Faltan carnets: ${sinC.map(p => esc(shortName(p))).join(', ')}. La mesa exige cédula vigente: que la lleven en físico.</p>`;
  h += `<p class="note">Datos generados el ${esc(DATA.generado)}. Las nóminas elegidas se guardan en este teléfono.</p>`;
  $('#view').innerHTML = h;
}
function setOpt(id, v){ S.m[id].opt = +v; save(); renderPartidos(); }
function setRival(id, v){ S.m[id].rival = v; save(); renderPartidos(); }

/* ---------- Elegir nómina ---------- */
let curM = null;
function renderNomina(id){
  curM = id || curM; const m = MATCHES.find(x => x.id === curM), st = S.m[curM], o = opt(m);
  const dupSet = dupDorsals(curM);
  let h = `<button class="back" onclick="go('partidos')">‹ Partidos</button>
    <div class="sticky-sum">
      <div class="counter"><div><div class="match-meta">P.${o.num} · ${o.hora} · Cancha ${o.cancha}</div><div class="vs" style="font-size:17px"><span>Perros RC</span> vs ${esc(rival(m))}</div></div>
      <div class="big"><b>${st.sel.length}</b>/${MAX}</div></div>
      <div class="tools">
        ${prevMatch(curM) ? `<button class="btn" onclick="copyPrev()">Copiar del partido anterior</button>` : ''}
        <button class="btn" onclick="autoNum()">Numerar 1–${MAX} en orden</button>
        <button class="btn" onclick="clearSel()">Limpiar</button>
        <button class="btn primary" ${st.sel.length ? '' : 'disabled'} onclick="openMesa('${curM}')">Mostrar en mesa</button>
      </div>
      ${dupSet.size ? `<p class="note warn" style="margin:8px 0 0">Dorsal repetido: ${[...dupSet].join(', ')}</p>` : ''}
    </div>
    <p class="note">Toca un jugador para incluirlo. El número es el dorsal de la camiseta para este partido.</p>
    <div class="plist">`;
  const list = [...P];
  list.forEach(p => {
    const on = st.sel.includes(p.n), d = dorsal(curM, p.n);
    h += `<div class="prow ${on?'sel':''}" onclick="toggleP(${p.n},event)">
      <div class="check"></div>
      <div class="who"><div class="nm">${esc(fullName(p))}</div><div class="sub">${esc(p.run)} · ${age(p)} años</div></div>
      ${on ? `<input type="text" class="dinput ${dupSet.has(String(d))?'dup':''}" inputmode="numeric" value="${esc(d)}" onclick="event.stopPropagation()" onchange="setDorsal(${p.n},this.value)" aria-label="Dorsal">` : docDots(p)}
    </div>`;
  });
  h += '</div>';
  $('#view').innerHTML = h;
}
function dupDorsals(mid){ const st = S.m[mid], seen = {}, d = new Set(); st.sel.forEach(n => { const v = String(st.dor[n] ?? '').trim(); if (!v) return; if (seen[v]) d.add(v); seen[v] = 1; }); return d; }
function nextFree(mid){ const st = S.m[mid], used = new Set(st.sel.map(n => parseInt(st.dor[n])).filter(Boolean)); for (let i = 1; i <= 99; i++) if (!used.has(i)) return i; return ''; }
function toggleP(n){
  const st = S.m[curM]; const i = st.sel.indexOf(n);
  if (i >= 0) { st.sel.splice(i,1); delete st.dor[n]; }
  else {
    if (st.sel.length >= MAX) { toast(`Máximo ${MAX} jugadores por partido`); return; }
    st.dor[n] = nextFree(curM); st.sel.push(n);
    if (!hasC(byN[n])) toast(`${shortName(byN[n])}: falta su carnet`);
  }
  save(); const y = window.scrollY; renderNomina(); window.scrollTo(0,y);
}
function setDorsal(n, v){ S.m[curM].dor[n] = v.replace(/\D/g,'').slice(0,2); save(); const y = window.scrollY; renderNomina(); window.scrollTo(0,y); }
function autoNum(){ const st = S.m[curM]; ordered(curM).forEach((p,i) => st.dor[p.n] = i + 1); save(); renderNomina(); toast('Dorsales numerados 1 a ' + st.sel.length); }
function clearSel(){ if (!S.m[curM].sel.length) return; if (!confirm('¿Quitar a todos los jugadores de este partido?')) return; S.m[curM].sel = []; S.m[curM].dor = {}; save(); renderNomina(); }
function prevMatch(id){ const i = MATCHES.findIndex(m => m.id === id); for (let k = i - 1; k >= 0; k--) if (S.m[MATCHES[k].id].sel.length) return MATCHES[k]; return null; }
function copyPrev(){ const pm = prevMatch(curM); if (!pm) return; const src = S.m[pm.id]; S.m[curM].sel = [...src.sel]; S.m[curM].dor = {...src.dor}; save(); renderNomina(); toast('Copiada la nómina de P.' + opt(pm).num); }

/* ---------- Plantel ---------- */
let q = '';
function renderPlantel(){
  const nc = P.filter(hasC).length, nd = P.filter(p => p.disc).length;
  let h = `<h2>Nómina Deportiva · ${P.length} jugadores</h2>
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <span class="pill ${nc===P.length?'ok':'mid'}">Carnets ${nc}/${P.length}</span>
      <span class="pill ${nd===P.length?'ok':'mid'}">Disclaimers ${nd}/${P.length}</span>
      <span class="note">Manager: ${esc(DATA.manager)}</span>
    </div>
    <input type="search" placeholder="Buscar nombre o RUN" value="${esc(q)}" oninput="q=this.value;drawPl()" style="margin-bottom:12px">
    <div class="plist" id="pl"></div>`;
  $('#view').innerHTML = h; drawPl();
}
function drawPl(){
  const t = q.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  const list = P.filter(p => !t || (fullName(p) + ' ' + p.run).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(t));
  $('#pl').innerHTML = list.length ? list.map((p) => `<div class="prow" onclick="openDocsList(PL_LIST, PL_LIST.indexOf(${p.n}))">
      <div class="num">${p.n}</div>
      <div class="who"><div class="nm">${esc(fullName(p))}</div><div class="sub">${esc(p.run)} · ${esc(p.fnac)} · ${age(p)} años</div></div>
      ${docDots(p)}<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
    </div>`).join('') : '<div class="empty">Sin resultados</div>';
  window.PL_LIST = list.map(p => p.n);
}

/* ---------- visor carnet + disclaimer ---------- */
let dList = [], dIdx = 0;
function openDocsList(list, i){ dList = list; dIdx = Math.max(0, i); drawDoc(); $('#docs').classList.add('on'); document.body.style.overflow = 'hidden'; }
function closeDocs(){ $('#docs').classList.remove('on'); if (!$('#mesa').classList.contains('on')) document.body.style.overflow = ''; }
function stepDoc(k){ dIdx = Math.min(dList.length - 1, Math.max(0, dIdx + k)); drawDoc(); }
function drawDoc(){
  const p = byN[dList[dIdx]]; const mid = $('#mesa').classList.contains('on') ? mesaId : null;
  const d = mid ? dorsal(mid, p.n) : '';
  $('#d-name').textContent = (d ? `#${d} · ` : '') + fullName(p);
  $('#d-sub').textContent = `RUN ${p.run} · nac. ${p.fnac} · ${age(p)} años · ${dIdx + 1}/${dList.length}`;
  const img = (src, lbl) => src ? `<div class="doc-lbl">${lbl}</div><img class="doc-img" src="${src}" alt="${lbl}" onclick="this.classList.toggle('zoom')">` : `<div class="doc-lbl">${lbl}</div><div class="missing">${lbl}: no enviado</div>`;
  $('#d-body').innerHTML = img(p.carnet[0], 'Carnet · anverso') + img(p.carnet[1], 'Carnet · reverso') + img(p.disc, 'Disclaimer firmado')
    + '<p class="note" style="text-align:center;margin-top:14px">Toca una imagen para ampliarla</p>';
  $('#d-body').scrollTop = 0;
  $('#d-prev').disabled = dIdx === 0; $('#d-next').disabled = dIdx === dList.length - 1;
}

/* ---------- modo mesa ---------- */
let mesaId = null, mesaList = [], wake = null;
async function openMesa(id){
  mesaId = id; const m = MATCHES.find(x => x.id === id), o = opt(m), list = ordered(id);
  mesaList = list.map(p => p.n);
  const dup = dupDorsals(id), noNum = list.filter(p => !String(dorsal(id,p.n)).trim());
  const ck = p => `<span class="cks">${!hasC(p) ? '<span class="ck no">sin carnet</span>' : hasR(p) ? '<span class="ck">carnet</span>' : '<span class="ck h">anverso</span>'} ${p.disc ? '<span class="ck">discl.</span>' : '<span class="ck no">sin discl.</span>'}</span>`;
  $('#sheet').innerHTML = `
    <div class="hd"><img src="${DATA.logo}" alt=""><div class="tt"><b>ANEXO C · NÓMINA DE JUEGO</b><span>Final Master Chile +35 · Curicó · sábado 21-11-2026</span></div></div>
    <div class="match"><span>Partido N° <b>${o.num}</b></span><span><b>PERROS RC</b> vs <b>${esc(rival(m).toUpperCase())}</b></span><span>${o.hora} · Cancha ${o.cancha}</span><span>${list.length} jugadores</span></div>
    ${dup.size || noNum.length ? `<p class="tip" style="color:#b00000">${dup.size ? 'Dorsales repetidos: ' + [...dup].join(', ') + '. ' : ''}${noNum.length ? noNum.length + ' jugador(es) sin dorsal.' : ''}</p>` : ''}
    <table><thead><tr><th>Dorsal</th><th>Nombre y apellido</th><th>RUN</th><th class="f">F. nacimiento</th><th class="cks"></th></tr></thead>
    <tbody>${list.map((p,i) => `<tr class="tap" onclick="openDocsList(mesaList,${i})"><td class="d">${esc(dorsal(id,p.n))}</td><td>${esc(fullName(p))}</td><td class="r">${esc(p.run)}</td><td class="f">${esc(p.fnac)}</td><td class="cks">${ck(p)}</td></tr>`).join('')}</tbody></table>
    <div class="foot"><div>Manager: <b>${esc(DATA.manager)}</b></div></div>
    <div class="foot"><div class="sign">Firma manager</div><div class="sign">Mesa de control</div></div>
    <p class="tip">Toca un jugador para mostrar su carnet y disclaimer.</p>`;
  $('#mesa').classList.add('on'); document.body.style.overflow = 'hidden';
  try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
}
function closeMesa(){ $('#mesa').classList.remove('on'); document.body.style.overflow = ''; try { wake?.release(); } catch (e) {} wake = null; }

$('#logo').src = DATA.logo;
go('partidos');
</script>
<style>
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:360px;text-align:center}
#lock .paw{width:64px;height:64px;margin:0 auto 14px;color:var(--neon)}
#lock h1{font-size:21px;margin:0 0 4px}
#lock p{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.45}
#lock input[type=password]{width:100%;min-height:50px;font-size:17px;text-align:center;letter-spacing:.3px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0 14px}
#lock label{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;margin:14px 0 16px}
#lock input[type=checkbox]{width:18px;height:18px;accent-color:var(--neon)}
#lock .btn{width:100%;min-height:50px;font-size:16px}
#lk-msg{min-height:22px;margin-top:14px;font-size:14px;color:var(--muted)}
#lk-msg.err{color:var(--bad)}
</style>
<div id="lock"><form class="box" id="lk-form" autocomplete="off" hidden>
  <svg class="paw" viewBox="0 0 64 64" fill="currentColor"><ellipse cx="16" cy="22" rx="6" ry="8"/><ellipse cx="28" cy="13" rx="6" ry="8.5"/><ellipse cx="41" cy="14" rx="6" ry="8.5"/><ellipse cx="51" cy="25" rx="5.5" ry="7.5"/><path d="M32 30c8 0 17 10 17 19 0 6-5 9-10 8-3-.5-5-2-7-2s-4 1.5-7 2c-5 1-10-2-10-8 0-9 9-19 17-19z"/></svg>
  <h1>Perros RC · Mesa de Control</h1>
  <p>Final Master Chile +35 · Curicó<br>Ingresa la clave del equipo para abrir la nómina, carnets y disclaimers.</p>
  <input type="password" id="lk-pw" placeholder="Clave" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label><input type="checkbox" id="lk-rem" checked> Recordar en este teléfono</label>
  <button class="btn primary" type="submit" id="lk-btn">Entrar</button>
  <div id="lk-msg"></div>
</form></div>
<script>
(async () => {
  const ITER = 600000, AD = new TextEncoder().encode('PRC1'), KEY = 'perros_mesa_key';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const form = document.getElementById('lk-form'), msg = document.getElementById('lk-msg');
  const say = (t, err) => { msg.textContent = t; msg.className = err ? 'err' : ''; };
  let buf = null;
  async function getData() {
    if (buf) return buf;
    const r = await fetch('data.bin', {cache: 'no-cache'});
    if (!r.ok) throw new Error('http ' + r.status);
    buf = new Uint8Array(await r.arrayBuffer());
    return buf;
  }
  async function decrypt(key, b) {
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(20, 32), additionalData: AD}, key, b.slice(32));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function boot(data) {
    window.__DATA = data;
    document.getElementById('lock').remove();
    const s = document.createElement('script');
    s.textContent = document.getElementById('appcode').textContent;
    document.body.append(s);
  }
  if (!window.crypto || !crypto.subtle) { form.hidden = false; say('Este navegador no permite abrir la app (se necesita https).', true); return; }
  // 1) clave recordada en este teléfono
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try {
      const key = await crypto.subtle.importKey('raw', Uint8Array.from(atob(saved), c => c.charCodeAt(0)), 'AES-GCM', true, ['decrypt']);
      return boot(await decrypt(key, await getData()));
    } catch (e) {
      if (e && e.name === 'OperationError') { try { localStorage.removeItem(KEY); } catch (_) {} }   // la clave cambió
      else { form.hidden = false; say('No se pudieron cargar los datos. Revisa la conexión y recarga.', true); }
    }
  }
  form.hidden = false;
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('lk-btn'); btn.disabled = true; say('Abriendo…');
    try {
      const b = await getData();
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('lk-pw').value.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b.slice(4, 20), iterations: ITER, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
      let data;
      try { data = await decrypt(key, b); } catch (e) { say('Clave incorrecta', true); btn.disabled = false; return; }
      if (document.getElementById('lk-rem').checked) {
        try { localStorage.setItem(KEY, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch (e) {}
      }
      boot(data);
    } catch (e) { say('No se pudieron descargar los datos. Revisa la conexión.', true); btn.disabled = false; }
  });
})();
</script>
